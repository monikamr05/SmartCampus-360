services:
  - type: web
    name: smartcampus-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false          # set via Render dashboard — never commit the value
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false          # e.g. https://smartcampus360.vercel.app
